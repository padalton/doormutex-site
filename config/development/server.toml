# The same security headers as static/_headers, so `hugo server` shows
# CSP violations during development. Keep both in sync (CI compares them).
[[headers]]
  for = "/**"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
