name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with HUGO_VERSION in the Cloudflare Pages settings (README).
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    name: Build · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo ${{ env.HUGO_VERSION }} (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: hugo --gc --minify
      - name: Check (no external assets, no inline code, links)
        run: python3 scripts/check_site.py public
      - name: Legal placeholders
        # Warn only: the production build on Cloudflare uses --panicOnWarning
        # and refuses to publish while params.legal is empty.
        run: |
          if hugo --gc --minify --panicOnWarning -d "$RUNNER_TEMP/strict" >/dev/null 2>&1; then
            echo "legal notice complete"
          else
            echo "::warning::params.legal is not filled in yet – Cloudflare Pages will refuse to build until it is (see README)."
          fi

  reuse:
    name: Licences · REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
