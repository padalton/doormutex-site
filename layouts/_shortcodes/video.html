{{- /* {{< video src="/video/wiring.mp4" poster="/video/wiring.jpg" caption="…" >}} – same origin, no autoplay */ -}}
<figure class="video">
  <video src="{{ .Get "src" | relURL }}" poster="{{ .Get "poster" | relURL }}" width="1920" height="1080" controls muted playsinline preload="none"></video>
  {{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
