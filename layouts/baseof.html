<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} – {{ T "tagline" }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ T "siteDescription" }}{{ end }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="{{ .Permalink }}">
  {{- range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{- if eq .Language.Lang (index hugo.Sites 0).Language.Lang }}
  <link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
  {{- end }}
  {{- end }}
  <link rel="icon" href="{{ "icon.svg" | relURL }}" type="image/svg+xml">
  {{- $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  <a class="skip" href="#main">{{ T "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
