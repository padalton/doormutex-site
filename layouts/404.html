{{ define "main" }}
<article class="wrap prose notfound">
  {{ partial "light.html" (dict "state" "yellow" "class" "blink") }}
  <h1>{{ T "notFoundTitle" }}</h1>
  <p>{{ T "notFoundText" }}</p>
  <p><a class="button primary" href="{{ site.Home.RelPermalink }}">{{ T "notFoundHome" }}</a></p>
</article>
{{ end }}
