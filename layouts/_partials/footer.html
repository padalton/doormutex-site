<footer class="site-footer">
  <div class="wrap">
    <ul class="footer-links">
      {{- range site.Menus.footer }}
      <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{- end }}
      <li><a href="{{ site.Params.repo }}">GitHub</a></li>
    </ul>
    <p>{{ T "footerPrivacy" }}</p>
    <p>{{ T "footerLicence" (dict "repo" site.Params.siteRepo) | safeHTML }}</p>
  </div>
</footer>
